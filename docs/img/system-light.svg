@keyframes flow{0%{transform:translateY(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateY(524px);opacity:0}}
.p{animation:flow 12s linear infinite;opacity:0}
.p1{animation-delay:-4s}
.p2{animation-delay:-8s}
@media (prefers-reduced-motion:reduce){.p{animation:none;display:none}}
</style>
