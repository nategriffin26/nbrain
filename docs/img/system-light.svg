<svg xmlns="http://www.w3.org/2000/svg" width="480" height="614" viewBox="0 0 480 614" role="img" aria-label="How nbrain works. Mail, texts and calendar, X bookmarks, coding sessions, bot chats, saves and research notes flow into the record, kept verbatim in Postgres with hybrid search. From the record nbrain keeps three smaller layers: the profile, sourced lines that change only from your own words; now, rewritten each morning; and the library, a card per bookmark or save. A brief is cut from them for each task. One MCP server gives each client (your bots, omp, Claude Code, Codex, claude.ai, ChatGPT), with its own scopes, the brief and direct search, fetch, changes and sql over the record.">
<title>How nbrain works. Mail, texts and calendar, X bookmarks, coding sessions, bot chats, saves and research notes flow into the record, kept verbatim in Postgres with hybrid search. From the record nbrain keeps three smaller layers: the profile, sourced lines that change only from your own words; now, rewritten each morning; and the library, a card per bookmark or save. A brief is cut from them for each task. One MCP server gives each client (your bots, omp, Claude Code, Codex, claude.ai, ChatGPT), with its own scopes, the brief and direct search, fetch, changes and sql over the record.</title>
