<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title id="title">nbrain architecture</title>
  <desc id="desc">Connectors and saves write events; ingest indexes, enriches and consolidates them into Postgres; a nightly gardener keeps a git context repo current; one MCP server serves both to agents, each under its own token and scopes.</desc>
  <style>
    svg { color: #1f2328; }
    @media (prefers-color-scheme: dark) { svg { color: #e6edf3; } }
    text { fill: currentColor; }
    .head { font-size: 11px; letter-spacing: 0.08em; fill-opacity: 0.6; }
    .title { font-weight: 600; font-size: 13px; }
    .muted { fill-opacity: 0.7; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.2; }
    .line { fill: none; stroke: #8c959f; stroke-width: 1.2; }
    .dash { stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- column heads -->
  <text class="head" x="100" y="22" text-anchor="middle">SOURCES</text>
  <text class="head" x="320" y="22" text-anchor="middle">INGEST</text>
  <text class="head" x="550" y="22" text-anchor="middle">STORE</text>
  <text class="head" x="760" y="22" text-anchor="middle">ONE DOOR</text>
  <text class="head" x="925" y="22" text-anchor="middle">AGENTS</text>

  <!-- sources -->
  <rect class="box" x="10" y="40" width="180" height="50" rx="6"/>
  <text class="title" x="100" y="61" text-anchor="middle">Mail · texts · calendar</text>
  <text class="muted" x="100" y="79" text-anchor="middle">Executor MCP</text>

  <rect class="box" x="10" y="110" width="180" height="50" rx="6"/>
  <text class="title" x="100" y="131" text-anchor="middle">X bookmarks</text>
  <text class="muted" x="100" y="149" text-anchor="middle">xurl, then hydrated</text>

  <rect class="box" x="10" y="180" width="180" height="50" rx="6"/>
  <text class="title" x="100" y="201" text-anchor="middle">Coding sessions</text>
  <text class="muted" x="100" y="219" text-anchor="middle">omp, your turns</text>

  <rect class="box" x="10" y="250" width="180" height="50" rx="6"/>
  <text class="title" x="100" y="271" text-anchor="middle">Pages · PDFs · video · notes</text>
  <text class="muted" x="100" y="289" text-anchor="middle">save tool, nbrain save</text>

  <!-- sources to events -->
  <path class="line" d="M190 65 L230 60" marker-end="url(#arrow)"/>
  <path class="line" d="M190 135 L230 68" marker-end="url(#arrow)"/>
  <path class="line" d="M190 205 L230 76" marker-end="url(#arrow)"/>
  <path class="line" d="M190 275 L230 84" marker-end="url(#arrow)"/>

  <!-- events and ingest -->
  <rect class="box" x="230" y="40" width="180" height="56" rx="6"/>
  <text class="title" x="320" y="63" text-anchor="middle">brain.events</text>
  <text class="muted" x="320" y="82" text-anchor="middle">deduped, resumable cursors</text>

  <path class="line" d="M320 96 L320 128" marker-end="url(#arrow)"/>

  <rect class="box" x="230" y="130" width="180" height="170" rx="6"/>
  <text class="title" x="320" y="153" text-anchor="middle">ingest loops</text>
  <text class="muted" x="320" y="177" text-anchor="middle">chunk, embed, index</text>
  <text class="muted" x="320" y="197" text-anchor="middle">enrich saved items</text>
  <text class="muted" x="320" y="217" text-anchor="middle">extract records</text>
  <text class="muted" x="320" y="237" text-anchor="middle">consolidate notes</text>
  <text class="muted" x="320" y="257" text-anchor="middle">write the life profile</text>
  <text class="muted" x="320" y="277" text-anchor="middle">index skills</text>

  <path class="line" d="M410 190 L450 120" marker-end="url(#arrow)"/>

  <!-- store -->
  <rect class="box" x="450" y="40" width="200" height="150" rx="6"/>
  <text class="title" x="550" y="63" text-anchor="middle">Postgres</text>
  <text class="muted" x="550" y="87" text-anchor="middle">items and chunks, verbatim</text>
  <text class="muted" x="550" y="107" text-anchor="middle">BM25 (ParadeDB)</text>
  <text class="muted" x="550" y="127" text-anchor="middle">vectors (pgvector)</text>
  <text class="muted" x="550" y="147" text-anchor="middle">records · notes · people</text>
  <text class="muted" x="550" y="167" text-anchor="middle">life profile</text>

  <path class="line" d="M550 190 L550 238" marker-end="url(#arrow)"/>
  <text class="muted" x="558" y="218" font-size="11">gardener, nightly</text>

  <rect class="box" x="450" y="240" width="200" height="110" rx="6"/>
  <text class="title" x="550" y="263" text-anchor="middle">Context repo (git)</text>
  <text class="muted" x="550" y="287" text-anchor="middle">profile files · journal</text>
  <text class="muted" x="550" y="307" text-anchor="middle">skills/ · styles/</text>
  <text class="muted" x="550" y="327" text-anchor="middle">each edit a signed commit</text>

  <!-- store to door -->
  <path class="line" d="M650 115 L690 115" marker-end="url(#arrow)"/>
  <path class="line" d="M650 280 L690 280" marker-end="url(#arrow)"/>
  <path class="line dash" d="M690 315 L650 315" marker-end="url(#arrow)"/>

  <!-- door -->
  <rect class="box" x="690" y="40" width="140" height="310" rx="6"/>
  <text class="title" x="760" y="63" text-anchor="middle">memory-mcp</text>
  <text class="muted" x="760" y="81" text-anchor="middle">/mcp</text>
  <text class="muted" x="760" y="119" text-anchor="middle">token = agent</text>
  <text class="muted" x="760" y="137" text-anchor="middle">+ scopes</text>
  <text class="muted" x="760" y="175" text-anchor="middle">BM25 + vectors</text>
  <text class="muted" x="760" y="193" text-anchor="middle">+ date + person</text>
  <text class="muted" x="760" y="211" text-anchor="middle">RRF, local rerank</text>
  <text class="muted" x="760" y="249" text-anchor="middle">context and skills</text>
  <text class="muted" x="760" y="287" text-anchor="middle">signed writes</text>
  <text class="muted" x="760" y="305" text-anchor="middle">remember · save</text>
  <text class="muted" x="760" y="323" text-anchor="middle">skill_save</text>

  <!-- agents -->
  <rect class="box" x="860" y="40" width="130" height="56" rx="6"/>
  <text class="title" x="925" y="63" text-anchor="middle">Local agents</text>
  <text class="muted" x="925" y="81" text-anchor="middle">loopback HTTP</text>

  <rect class="box" x="860" y="124" width="130" height="56" rx="6"/>
  <text class="title" x="925" y="147" text-anchor="middle">stdio clients</text>
  <text class="muted" x="925" y="165" text-anchor="middle">nbrain mcp relay</text>

  <rect class="box" x="860" y="208" width="130" height="56" rx="6"/>
  <text class="title" x="925" y="231" text-anchor="middle">Other devices</text>
  <text class="muted" x="925" y="249" text-anchor="middle">tailnet</text>

  <rect class="box" x="860" y="292" width="130" height="58" rx="6"/>
  <text class="title" x="925" y="315" text-anchor="middle">Cloud chat apps</text>
  <text class="muted" x="925" y="333" text-anchor="middle">Funnel + OAuth</text>

  <path class="line" d="M832 68 L858 68" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M832 152 L858 152" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M832 236 L858 236" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="line" d="M832 321 L858 321" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
